let plan = "A", done = new Set();
const key = p => "bible2026:" + p;
const todayISO = new Date().toISOString().slice(0,10);

const hasArtifactStore = typeof window.storage !== "undefined";
async function load(){
  try{
    if(hasArtifactStore){ const r = await window.storage.get(key(plan)); done = new Set(JSON.parse(r.value)); }
    else { done = new Set(JSON.parse(localStorage.getItem(key(plan)) || "[]")); }
  } catch(e){ done = new Set(); }
  render();
}
async function save(){
  try{
    if(hasArtifactStore) await window.storage.set(key(plan), JSON.stringify([...done]));
    else localStorage.setItem(key(plan), JSON.stringify([...done]));
  } catch(e){ document.getElementById("ft").textContent = "저장 실패 — 화면에만 반영됩니다"; }
}

function render(){
  const days = PLANS[plan];
  const left = days.filter(d => !done.has(d.d)).length;
  const missed = days.filter(d => d.d < todayISO && !done.has(d.d)).length;
  document.getElementById("hd").innerHTML = left + '<small>일 남음</small>';
  const pct = Math.round((days.length-left)/days.length*100);
  document.getElementById("hs").innerHTML =
    `${days.length-left} / ${days.length}일 완료 · ${pct}%` +
    (missed ? ` · <b>밀린 날 ${missed}일</b>` : "");

  document.getElementById("ticks").innerHTML = days.map(d =>
    `<i class="tick ${done.has(d.d)?"done":d.d===todayISO?"today":d.d<todayISO?"miss":""}"></i>`).join("");

  const t = days.find(d => d.d === todayISO);
  const tc = document.getElementById("tc");
  if(t){
    tc.hidden = false;
    tc.innerHTML = `<div class="lbl">오늘 ${t.d.slice(5).replace("-","/")} (${WD[new Date(t.d).getDay()===0?6:new Date(t.d).getDay()-1]})</div>
      <div class="txt">${t.r}</div><div class="meta">${t.c}장 · 약 ${t.v}절</div>`;
  } else {
    const next = days.find(d => d.d >= todayISO);
    tc.hidden = false;
    tc.innerHTML = next
      ? `<div class="lbl">오늘은 쉬는 날</div><div class="txt">다음 읽기 ${next.d.slice(5).replace("-","/")}</div><div class="meta">${next.r}</div>`
      : `<div class="lbl">완독</div><div class="txt">1독을 마쳤습니다</div>`;
  }

  let html = "", m = null;
  days.forEach(d => {
    const mm = +d.d.slice(5,7);
    if(mm !== m){ m = mm; html += `<div class="mh">${m}월</div>`; }
    const dt = new Date(d.d), w = WD[dt.getDay()===0?6:dt.getDay()-1];
    html += `<div class="row ${done.has(d.d)?"on":""} ${d.d===todayISO?"is-today":""}" data-d="${d.d}" role="checkbox"
      aria-checked="${done.has(d.d)}" tabindex="0">
      <span class="box"></span><span class="date">${+d.d.slice(5,7)}/${+d.d.slice(8)} ${w}</span>
      <span class="body"><span class="txt2">${d.r}</span><div class="cnt">${d.c}장 · ${d.v}절</div></span></div>`;
  });
  document.getElementById("list").innerHTML = html;
  const total = days.reduce((s,d)=>s+d.c,0), readCh = days.filter(d=>done.has(d.d)).reduce((s,d)=>s+d.c,0);
  document.getElementById("ft").textContent = `${readCh} / ${total}장`;
}

function toggle(el){
  const d = el.dataset.d;
  done.has(d) ? done.delete(d) : done.add(d);
  save(); render();
}
document.getElementById("list").addEventListener("click", e => {
  const r = e.target.closest(".row"); if(r) toggle(r);
});
document.getElementById("list").addEventListener("keydown", e => {
  if(e.key===" "||e.key==="Enter"){ const r=e.target.closest(".row"); if(r){ e.preventDefault(); toggle(r);} }
});
document.querySelectorAll(".pill").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".pill").forEach(x => x.setAttribute("aria-pressed", x===b));
  plan = b.dataset.p; load();
}));
document.getElementById("rs").addEventListener("click", async () => {
  done = new Set(); await save(); render();
});
