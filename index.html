#bp .row.is-today{border-color:var(--amber);background:var(--amber-tint)}

let plan = "A", done = new Set(), firstPaint = true;

async function get(k){
  if(hasArtifactStore){ const r = await window.storage.get(k); return r.value; }
  return localStorage.getItem(k);
}
async function set(k,v){
  if(hasArtifactStore) await window.storage.set(k,v); else localStorage.setItem(k,v);
}
async function save(){

}
async function loadChecks(){

}
async function boot(){
  try{ const p = await get("bible2026:plan"); if(p === "A" || p === "B") plan = p; }catch(e){}
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === plan));
  loadChecks();
}

function render(){
  const days = PLANS[plan];
  const left = days.filter(d => !done.has(d.d)).length;
  const missed = days.filter(d => d.d < todayISO && !done.has(d.d)).length;
  document.getElementById("hd").textContent = left;
  document.getElementById("hs").innerHTML =
    `${days.length-left} / ${days.length}일 · ${Math.round((days.length-left)/days.length*100)}%` +
    (missed ? `<span class="chip">밀린 날 ${missed}일</span>` : "");
  document.getElementById("ticks").innerHTML = days.map(d =>
    `<i class="tick ${done.has(d.d)?"done":d.d===todayISO?"today":d.d<todayISO?"miss":""}"></i>`).join("");

  const t = days.find(d => d.d === todayISO);
  const next = days.find(d => d.d >= todayISO);
  const tc = document.getElementById("tc");
  if(t){
    tc.innerHTML = `<div class="lbl">오늘 ${md(t.d)} (${dow(t.d)})</div><div class="txt">${t.r}</div>
      <div class="meta">${t.c}장 · 약 ${t.v}절</div>
      <button class="cta ${done.has(t.d)?"on":""}" data-d="${t.d}">${done.has(t.d)?"읽음 · 취소하기":"오늘 읽기 완료"}</button>`;
  } else if(next){
    tc.innerHTML = `<div class="lbl">오늘은 쉬는 날</div><div class="txt">다음 ${md(next.d)} (${dow(next.d)}) · ${next.r}</div>
      <div class="meta">${next.c}장 · 약 ${next.v}절</div>`;
  } else {
    tc.innerHTML = `<div class="lbl">완독</div><div class="txt">1독을 마쳤습니다</div>`;
  }

  let html = "", m = null;
  days.forEach(d => {
    const mm = +d.d.slice(5,7);
    if(mm !== m){ m = mm; html += `<div class="mh">${m}월</div>`; }
    html += `<div class="row ${done.has(d.d)?"on":""} ${d.d===todayISO?"is-today":""}" data-d="${d.d}"
      role="checkbox" aria-checked="${done.has(d.d)}" tabindex="0">
      <span class="box"></span><span class="date">${md(d.d)} ${dow(d.d)}</span>
      <span class="body"><span class="txt2">${d.r}</span><div class="cnt">${d.c}장 · ${d.v}절</div></span></div>`;
  });

  const total = days.reduce((s,d)=>s+d.c,0), read = days.filter(d=>done.has(d.d)).reduce((s,d)=>s+d.c,0);

    firstPaint = false;
    const anchor = next && document.querySelector(`.row[data-d="${next.d}"]`);
    if(anchor) requestAnimationFrame(() =>

  }
}

function toggle(d){ done.has(d) ? done.delete(d) : done.add(d); save(); render(); }
document.getElementById("bp").addEventListener("click", e => {
  const el = e.target.closest("[data-d]"); if(el) toggle(el.dataset.d);
});
document.getElementById("list").addEventListener("keydown", e => {
